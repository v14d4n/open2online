plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false

        // Minecraft ships slf4j-api 2.0.17; PortMapper pulls in 1.7.21 transitively and the two
        // branches disagree on the provider lookup SPI. Relocating it is not an option either —
        // PortMapper would log into an isolated copy with no backend bound — so it is dropped and
        // binds against the game's copy instead.
        exclude group: 'org.slf4j'
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Mod Menu is optional at runtime. Fabric Loader only instantiates a `modmenu` entrypoint when
    // something asks for entrypoints of that type, so the class below is never loaded without it.
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    // Port mapping backends, bundled into the jar.
    implementation "org.bitlet:weupnp:$rootProject.weupnp_version"
    implementation "com.simtechdata:WaifUPnP:$rootProject.waifupnp_version"
    implementation "com.offbynull.portmapper:portmapper:$rootProject.portmapper_version"
    implementation "org.apache.commons:commons-collections4:$rootProject.commons_collections_version"
    shadowBundle "org.bitlet:weupnp:$rootProject.weupnp_version"
    shadowBundle "com.simtechdata:WaifUPnP:$rootProject.waifupnp_version"
    shadowBundle "com.offbynull.portmapper:portmapper:$rootProject.portmapper_version"
    shadowBundle "org.apache.commons:commons-collections4:$rootProject.commons_collections_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
