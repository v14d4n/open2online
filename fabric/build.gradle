plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false

        // Minecraft ships slf4j-api 2.0.17; PortMapper pulls in 1.7.21 transitively and the two
        // branches disagree on the provider lookup SPI. Relocating it is not an option either —
        // PortMapper would log into an isolated copy with no backend bound — so it is dropped and
        // binds against the game's copy instead.
        exclude group: 'org.slf4j'
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Supplies ModConfigSpec on Fabric; NeoForge has it built in, so this side only.
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.forge_config_api_port_version"

    // Port mapping backends, bundled into the jar.
    implementation "org.bitlet:weupnp:$rootProject.weupnp_version"
    implementation "com.simtechdata:WaifUPnP:$rootProject.waifupnp_version"
    implementation "com.offbynull.portmapper:portmapper:$rootProject.portmapper_version"
    implementation "org.apache.commons:commons-collections4:$rootProject.commons_collections_version"
    shadowBundle "org.bitlet:weupnp:$rootProject.weupnp_version"
    shadowBundle "com.simtechdata:WaifUPnP:$rootProject.waifupnp_version"
    shadowBundle "com.offbynull.portmapper:portmapper:$rootProject.portmapper_version"
    shadowBundle "org.apache.commons:commons-collections4:$rootProject.commons_collections_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Keep the bundled backends out of the global namespace so other mods shipping the same
    // libraries cannot clash with ours.
    relocate 'org.bitlet.weupnp', "${project.group}.relocated.weupnp"
    relocate 'com.simtechdata.waifupnp', "${project.group}.relocated.waifupnp"
    relocate 'com.offbynull.portmapper', "${project.group}.relocated.portmapper"
    // Whole namespace, not just collections4: PortMapper drags in commons-lang3 3.4 and
    // commons-io 2.5 transitively, and unrelocated they shadow the far newer copies Minecraft
    // ships — MutableObject.get() only exists from commons-lang3 3.14, so the game dies at
    // bootstrap with NoSuchMethodError.
    relocate 'org.apache.commons', "${project.group}.relocated.commons"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
