import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.ApacheNoticeResourceTransformer

plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral() // WeUPnP, WaifUPnP and PortMapper
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }
    
    plugins.withId('com.gradleup.shadow') {
        tasks.named('shadowJar', ShadowJar) {
            // Keep the bundled backends out of the global namespace so other mods shipping the same
            // libraries cannot clash with ours.
            relocate 'org.bitlet.weupnp', "${project.group}.relocated.weupnp"
            relocate 'com.simtechdata.waifupnp', "${project.group}.relocated.waifupnp"
            relocate 'com.offbynull.portmapper', "${project.group}.relocated.portmapper"
            // Whole namespace, not just collections4: PortMapper drags in commons-lang3 3.4 and
            // commons-io 2.5 transitively, and unrelocated they shadow the far newer copies
            // Minecraft ships — MutableObject.get() only exists from commons-lang3 3.14, so the
            // game dies at bootstrap with NoSuchMethodError.
            relocate 'org.apache.commons', "${project.group}.relocated.commons"

            transform(ApacheNoticeResourceTransformer) { addHeader = false }
        }
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
