name: Bug report
description: Something in the mod behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the port does not open, or the server publishes but nobody can connect, use **Port or connection problem** instead - it asks the questions that matter for that case.

        English or Russian, both are fine.

  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I am using the latest version of the mod
          required: true
        - label: I searched the existing issues
          required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Shown in the mod list.
      placeholder: 1.4.0
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: 1.21.11
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
        - Forge (1.0.3 and older)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the mod did, and what you expected it to do instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "`.minecraft/logs/latest.log` from the session where it happened. Paste the part around the error, or upload the whole file to https://mclo.gs and put the link here."
      render: text

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: Anything else installed that might be involved. "Only Open2Online, Architectury and Fabric API" is a useful answer too.
