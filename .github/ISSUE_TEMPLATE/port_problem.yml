name: Port or connection problem
description: The port will not open, or the server publishes but nobody can connect
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The mod tries to say in chat why it failed. That message is the most useful thing you can tell me here.

        English or Russian, both are fine.

  - type: dropdown
    id: message
    attributes:
      label: What the mod said in chat
      options:
        - "UPnP is not available / UPnP/NAT-PMP/PCP is not available"
        - "Failed to open the port with every library"
        - "Failed to open port. Try changing it or the library"
        - "Port N is already in use"
        - "Your provider uses CGNAT"
        - "Your router is itself behind another router"
        - "Unable to host online game"
        - "Failed to get external IP"
        - "Nothing - the port opened and the server started, but nobody can connect"
        - "Something else, or no message at all"
    validations:
      required: true

  - type: dropdown
    id: library
    attributes:
      label: Library
      description: Advanced Settings -> Library.
      options:
        - Auto
        - WeUPnP
        - WaifUPnP
        - PortMapper
    validations:
      required: true

  - type: dropdown
    id: tried-portmapper
    attributes:
      label: Have you tried PortMapper specifically?
      description: It is the only one that also speaks NAT-PMP and PCP, so it reaches routers the other two cannot.
      options:
        - "Yes, it failed as well"
        - "No, not yet"
    validations:
      required: true

  - type: dropdown
    id: upnp-enabled
    attributes:
      label: Is UPnP switched on in the router settings?
      options:
        - "Yes"
        - "No"
        - "I don't know, or I cannot get into the router"
    validations:
      required: true

  - type: input
    id: router
    attributes:
      label: Router model
      placeholder: TP-Link Archer AX55

  - type: input
    id: provider
    attributes:
      label: Country and internet provider
      description: Helps to tell CGNAT apart from a router that simply refuses.

  - type: dropdown
    id: firewall
    attributes:
      label: Have you tried "Recreate Firewall Rules"?
      description: Only worth trying when the server starts with no errors but nobody can reach it. Windows only.
      options:
        - "Yes, it did not help"
        - "Yes, and it fixed it"
        - "No"
        - "I am not on Windows"

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: 1.4.0
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: 1.21.11
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
        - Forge (1.0.3 and older)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "`.minecraft/logs/latest.log` from the session where it happened. Attach the file, or paste the part around the error."
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots of the chat, what you have already tried, whether it ever worked before.
