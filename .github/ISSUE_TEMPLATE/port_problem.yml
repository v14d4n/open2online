name: Port or connection problem
description: The port will not open, or the server publishes but nobody can connect
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The mod tries to say in chat why it failed - that message is the most useful thing you can tell me here.

        English or Russian, both are fine.

  - type: textarea
    id: message
    attributes:
      label: What the mod said in chat
      description: Write the message or attach a screenshot. If it said nothing at all, say so.
    validations:
      required: true

  - type: dropdown
    id: library
    attributes:
      label: Library
      description: Advanced Settings -> Library. Auto tries all three, so it failing means all three failed.
      options:
        - Auto
        - WeUPnP
        - WaifUPnP
        - PortMapper
    validations:
      required: true

  - type: dropdown
    id: upnp-enabled
    attributes:
      label: Is UPnP switched on in the router settings?
      options:
        - "Yes"
        - "No"
        - "I don't know, or I cannot get into the router"
    validations:
      required: true

  - type: dropdown
    id: cgnat
    attributes:
      label: Does your provider use CGNAT?
      description: Compare the WAN address in your router with the one a "what is my IP" site shows you. Different addresses mean CGNAT.
      options:
        - "No, the two addresses match"
        - "Yes, they are different"
        - "I don't know"
    validations:
      required: true

  - type: input
    id: router
    attributes:
      label: Router model
      placeholder: TP-Link Archer AX55

  - type: dropdown
    id: firewall
    attributes:
      label: Have you tried "Recreate Firewall Rules"?
      description: Only worth trying when the server starts with no errors but nobody can reach it. Windows only.
      options:
        - "Yes, it did not help"
        - "Yes, and it fixed it"
        - "No, or I am not on Windows"

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: 1.4.0
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: 1.21.11
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
        - Forge (1.0.3 and older)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "`.minecraft/logs/latest.log` from the session where it happened. Attach the file, or paste the part around the error."
      render: text
